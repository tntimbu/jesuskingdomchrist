<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kingdom of Christ" />
    <link rel="manifest" href="manifest.json" />
    <title>Kingdom of Christ - CMS Pro</title>
    <!-- Google Fonts Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090d16] text-slate-100 min-h-screen">
    <div id="root" style="background-color:#090d16;min-height:100vh;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var fb = document.getElementById('fallback-action');
        var errDesc = document.getElementById('error-desc');
        if (fb) {
          fb.style.display = 'block';
          if (errDesc && e.message) errDesc.textContent = 'Gagal memuat modul: ' + e.message;
        }
      });
      setTimeout(function() {
        var root = document.getElementById('root');
        var fb = document.getElementById('fallback-action');
        if (root && root.firstElementChild && root.firstElementChild.id !== 'app-container' && fb) {
          fb.style.display = 'block';
        }
      }, 5000);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
