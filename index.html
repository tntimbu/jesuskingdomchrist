    <meta name="twitter:card" content="summary_large_image" />

    <title>CMS App - Portal &amp; Sistem Manajemen Gereja</title>
    <!-- Google Fonts Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f0f5f2] text-slate-800 min-h-screen" style="background-color:#f0f5f2;">
    <div id="root" style="background-color:#f0f5f2;min-height:100vh;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var fb = document.getElementById('fallback-action');
        var errDesc = document.getElementById('error-desc');
        if (fb) {
          fb.style.display = 'block';
          if (errDesc && e.message) errDesc.textContent = 'Gagal memuat modul: ' + e.message;
        }
      });
      setTimeout(function() {
        var root = document.getElementById('root');
        var fb = document.getElementById('fallback-action');
        if (root && root.firstElementChild && root.firstElementChild.id !== 'app-container' && fb) {
          fb.style.display = 'block';
        }
      }, 5000);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
        });
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
