<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle / card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle outer border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Inner Sanctuary Halo / Rays -->
  <circle cx="256" cy="220" r="140" fill="url(#glowGrad)" />
  <circle cx="256" cy="220" r="100" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4" />

  <!-- Church Arch Portal Silhouette -->
  <path d="M 176 390 L 176 260 Q 176 180 256 160 Q 336 180 336 260 L 336 390 Z" fill="#1e293b" fill-opacity="0.4" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Holy Golden Latin Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Beam -->
    <rect x="238" y="110" width="36" height="230" rx="8" fill="url(#goldGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="170" y="175" width="172" height="36" rx="8" fill="url(#goldGrad)" />
    <!-- Center Diamond Jewel -->
    <polygon points="256,173 274,193 256,213 238,193" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Church Base Foundation / Open Scripture Ribbon -->
  <path d="M 130 400 Q 256 370 382 400 L 370 422 Q 256 396 142 422 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="410" r="4" fill="#ffffff" />

  <!-- Text Subtitle "CMS PRO" -->
  <text x="256" y="456" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#e2e8f0" letter-spacing="6">CMS PRO</text>
</svg>
